name: Debug Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-windows-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: check Rust compilation only
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
        timeout-minutes: 30
      - name: build Rust release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
        timeout-minutes: 45
