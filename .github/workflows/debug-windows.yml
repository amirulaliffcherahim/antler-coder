name: Debug Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-windows-rust:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>error.txt
        continue-on-error: true
        timeout-minutes: 15
      - name: commit error log
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@antler-coder.dev"
          git checkout -b ci-error-logs-$(Get-Date -Format 'yyyyMMdd-HHmmss')
          git add error.txt
          git commit -m "ci: Windows cargo check error log"
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
