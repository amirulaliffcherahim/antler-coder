name: Debug Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-windows-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: check cargo metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > cargo-metadata.json 2>cargo-metadata-err.txt
        continue-on-error: true
      - name: check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>cargo-check-err.txt
        continue-on-error: true
        timeout-minutes: 30
      - name: upload error logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-logs
          path: |
            cargo-metadata.json
            cargo-metadata-err.txt
            cargo-check-err.txt
