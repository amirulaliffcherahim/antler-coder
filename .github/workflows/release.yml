name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: build app
        run: pnpm tauri build --bundles deb,rpm --verbose
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antler-Coder-Linux
          path: src-tauri/target/release/bundle/

  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: build app
        run: pnpm tauri build --bundles msi --verbose
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antler-Coder-Windows
          path: src-tauri/target/release/bundle/

  build-macos-arm:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: build app
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --verbose
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antler-Coder-macOS-ARM
          path: src-tauri/target/release/bundle/
